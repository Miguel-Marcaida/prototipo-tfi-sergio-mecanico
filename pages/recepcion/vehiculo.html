<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Vehículo - Sergio Mecánico</title>
    <link rel="stylesheet" href="../../css/styles.css">
</head>
<body>

    <header class="header">
        <span>🔧 Sergio Mecánico - Sistema de Gestión Integral Automotriz</span>
        <div>
            <a href="index.html" style="color: white; text-decoration: none; font-size: 0.9rem; margin-right: 15px;">&larr; MENÚ RECEPCIÓN</a>
           
        </div>
    </header>

    <div class="container">
        <h1>REGISTRAR VEHÍCULO</h1>

        <input type="hidden" id="turnoOrigen" value="">

        <form id="formVehiculo">
            <div class="split-layout">
                <!-- Columna Izquierda: Datos -->
                <div>
                    <div class="panel">
                        <h2>Datos del Cliente</h2>
                        <div class="form-group">
                            <label>Nombre:</label>
                            <input type="text" id="nombre" required>
                        </div>
                        <div class="form-group">
                            <label>DNI:</label>
                            <input type="text" id="dni" required>
                        </div>
                        <div class="form-group">
                            <label>Teléfono:</label>
                            <input type="text" id="telefono" required>
                        </div>
                    </div>

                    <div class="panel" style="margin-top: 20px;">
                        <h2>Datos del Vehículo</h2>
                        <div class="form-group">
                            <label>Patente:</label>
                            <input type="text" id="patente" required>
                        </div>
                        <div class="form-group">
                            <label>Modelo:</label>
                            <input type="text" id="modelo" required>
                        </div>
                        <div class="form-group">
                            <label>N° Chasis:</label>
                            <input type="text" id="chasis" required>
                        </div>
                    </div>
                </div>

                <!-- Columna Derecha: Observaciones y Botones -->
                <div>
                    <div class="panel">
                        <h2>Observaciones</h2>
                        <div class="form-group">
                            <textarea id="observaciones" rows="10" placeholder="Ej: Cliente reporta ruido en la parte delantera..."></textarea>
                        </div>
                    </div>
                    
                    <div class="actions">
                        <button type="submit" class="btn btn-primary">GUARDAR ADMISIÓN</button>
                        <button type="button" class="btn btn-secondary" onclick="window.location.href='index.html'">CANCELAR</button>
                    </div>
                    <div id="mensaje"></div>
                </div>
            </div>
        </form>
    </div>

    <script src="../../js/db.js"></script>
    <script src="../../js/vehiculo.js"></script>
</body>
</html>
